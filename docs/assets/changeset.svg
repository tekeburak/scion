<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-label="The shape of a Scion changeset, its file changes, blobs and derived data">
<title>The shape of a Scion changeset, its file changes, blobs and derived data</title>
