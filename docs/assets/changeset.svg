<rect x="0" y="0" width="1600" height="780" rx="24" fill="url(#glow)"/>
<text x="64" y="72" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="34" fill="#e8edf5" font-weight="700" text-anchor="start">The shape of a changeset</text>
<text x="64" y="108" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="19" fill="#93a1b8" font-weight="400" text-anchor="start">Only what changed against the first parent is hashed. Trees, history and blame are derived from it and stored beside it.</text>
