[graph]
all-features = true

[advisories]
ignore = [
    # webpki-roots 0.26 (distrusted emSign intermediates) reaches us only through sqlx 0.8's
    # TLS feature, and there is no fixed 0.26 release. Postgres connections are plaintext on the
    # compose stack today; Phase 9 (hosted Postgres over TLS) moves to sqlx 0.9, which carries
    # webpki-roots 1.x, and drops this entry.
    { id = "RUSTSEC-2026-0381", reason = "sqlx 0.8 pins webpki-roots 0.26; resolved by the sqlx 0.9 move in Phase 9" },
]

[licenses]
# The allow list is a policy, not an inventory; don't warn about unused entries.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots: Mozilla CA bundle data
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
