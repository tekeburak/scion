[workspace]
resolver = "3"
members = [
    "crates/scion-types",
    "crates/scion-store",
    "crates/scion-derived",
    "crates/scion-core",
    "crates/scion-diff3",
    "crates/scion-proto",
    "crates/scion-server",
    "crates/scion-client",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/tekeburak/scion"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
scion-types = { path = "crates/scion-types", version = "0.0.1" }
scion-store = { path = "crates/scion-store", version = "0.0.1" }
scion-derived = { path = "crates/scion-derived", version = "0.0.1" }
scion-core = { path = "crates/scion-core", version = "0.0.1" }
scion-diff3 = { path = "crates/scion-diff3", version = "0.0.1" }
scion-proto = { path = "crates/scion-proto", version = "0.0.1" }
scion-server = { path = "crates/scion-server", version = "0.0.1" }

# Diff / merge
diffy = "0.5.2"

# Hashing / encoding
blake3 = "1.5"
hex = "0.4"
bytes = "1"

# RPC
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-health = "0.14"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
async-trait = "0.1"
tokio-stream = { version = "0.1", features = ["net"] }

# Errors / serde
thiserror = "2"
serde = { version = "1", features = ["derive"] }

# Testing
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
