[package]
name = "scion-derived"
description = "Derived data for Scion: the recursive derivation framework and the data types built on it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
scion-types.workspace = true
scion-store.workspace = true
async-trait.workspace = true
bytes.workspace = true
thiserror.workspace = true
imara-diff.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio.workspace = true

proptest = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[features]
default = []
# Exposes `scion_derived::test_util` (naive materialisation, builders,
# counting stores, proptest generators) to other crates' tests.
test-util = ["dep:proptest"]

[lints]
workspace = true
