[package]
name = "scn"
description = "The Scion command-line client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
scion-types.workspace = true
scion-client.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
diffy = { workspace = true, features = ["std"] }
hex.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["fs", "time"] }
tonic.workspace = true

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "form"] }
bytes.workspace = true
object_store = { version = "0.14.2", features = ["aws"] }
reqwest = { version = "0.13", default-features = false }
scion-derived = { workspace = true, features = ["test-util"] }
scion-server.workspace = true
scion-store.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["net"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[features]
default = []
# Enables the end-to-end test against the compose stack (Postgres + an
# S3-compatible server, see deploy/docker-compose.yml).
integration = []

[lints]
workspace = true
