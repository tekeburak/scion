[package]
name = "scn"
description = "The Scion command-line client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
scion-types.workspace = true
scion-client.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
diffy = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["fs"] }
tonic.workspace = true

[dev-dependencies]
bytes.workspace = true
scion-derived = { workspace = true, features = ["test-util"] }
scion-server.workspace = true
scion-store.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
