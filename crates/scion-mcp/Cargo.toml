[package]
name = "scion-mcp"
description = "MCP server for agents: Scion repositories as tools and resources, over stdio or streamable HTTP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
clap = { version = "4.6", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
rmcp = { version = "3.6", features = ["transport-io", "transport-streamable-http-server"] }
schemars = "1"
scion-types.workspace = true
serde.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["net", "io-std"] }

[dev-dependencies]
rmcp = { version = "3.6", features = ["client", "transport-streamable-http-client-reqwest"] }
scion-proto.workspace = true
scion-server.workspace = true
scion-store.workspace = true
tonic.workspace = true

[lints]
workspace = true
