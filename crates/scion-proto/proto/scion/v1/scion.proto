// The Scion wire protocol, version 1.
//
// Protobuf is the transport only. No id is ever computed over a protobuf
// encoding: trees and changesets travel as their canonical encoding
// (docs/DATA_MODEL.md), and the receiver recomputes the id from those bytes.
//
// Every id field holds the 32 raw BLAKE3 digest bytes, not hex.

syntax = "proto3";

package scion.v1;

// ---------------------------------------------------------------------------
// Object plane: immutable trees and blobs by id. Implemented by scion-server,
// scion-cache and scion-daemon, so a client need not know the topology.
// A missing object is NOT_FOUND. Objects are shared by every repository, but
// each request names the repository it reads or writes for, and the caller
// needs `reader` there.
// ---------------------------------------------------------------------------

service ObjectService {
  rpc GetTree(GetTreeRequest) returns (GetTreeResponse);
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse);
  rpc PutBlob(PutBlobRequest) returns (PutBlobResponse);
  rpc PutTree(PutTreeRequest) returns (PutTreeResponse);
}

message GetTreeRequest {
  bytes id = 1;
  string repo = 2;
}

message GetTreeResponse {
  // Canonical encoding (`SCTR`); blake3 of these bytes is the requested id.
  bytes tree = 1;
}

message GetBlobRequest {
  bytes id = 1;
  string repo = 2;
}

message GetBlobResponse {
  // Raw file bytes; blake3 of these bytes is the requested id.
  bytes data = 1;
}

message PutBlobRequest {
  bytes data = 1;
  string repo = 2;
}

message PutBlobResponse {
  bytes id = 1;
}

message PutTreeRequest {
  // Canonical encoding (`SCTR`).
  bytes tree = 1;
  string repo = 2;
}

message PutTreeResponse {
  bytes id = 1;
}

// ---------------------------------------------------------------------------
// Control plane: served only by scion-server. Every request names its
// repository; one server serves many. Each RPC needs a role in it: `reader`
// for reads, `writer` for CreateChangeset, Rebase, Merge, Revert and
// SubmitChangeRequest, `admin` of the whole repository for MoveRef, Grant,
// Revoke and ListGrants; InitRepo needs `admin` on the server (grants of
// repository `*`); WhoAmI needs only a token. A missing role is
// PERMISSION_DENIED.
// ---------------------------------------------------------------------------

service ControlService {
  rpc InitRepo(InitRepoRequest) returns (InitRepoResponse);
  rpc GetRef(GetRefRequest) returns (GetRefResponse);
  rpc CreateChangeset(CreateChangesetRequest) returns (CreateChangesetResponse);
  rpc MoveRef(MoveRefRequest) returns (MoveRefResponse);
  rpc Diff(DiffRequest) returns (DiffResponse);
  rpc Log(LogRequest) returns (LogResponse);
  rpc PathLog(PathLogRequest) returns (LogResponse);
  rpc MergeBase(MergeBaseRequest) returns (MergeBaseResponse);
  rpc Rebase(RebaseRequest) returns (RebaseResponse);
  rpc Merge(MergeRequest) returns (MergeResponse);
  rpc Revert(RevertRequest) returns (RevertResponse);
  rpc Blame(BlameRequest) returns (BlameResponse);
  rpc SubmitChangeRequest(SubmitChangeRequestRequest) returns (ChangeRequest);
  rpc GetChangeRequest(GetChangeRequestRequest) returns (ChangeRequest);
  rpc ListChangeRequests(ListChangeRequestsRequest) returns (ListChangeRequestsResponse);
  rpc FindLanding(FindLandingRequest) returns (FindLandingResponse);
  rpc Grant(GrantRequest) returns (GrantResponse);
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse);
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
}

// Create a repository with `main` at its root changeset and make the caller
// its admin. ALREADY_EXISTS if it exists.
message InitRepoRequest {
  string repo = 1;
}

message InitRepoResponse {
  // The root changeset `main` points at.
  bytes main = 1;
  uint64 version = 2;
}

// Server refs are only `main` and `release/*`. An unknown ref is NOT_FOUND.
message GetRefRequest {
  string repo = 1;
  string name = 2;
}

message GetRefResponse {
  bytes target = 1;
  // Compare-and-swap version; present it to MoveRef.
  uint64 version = 2;
  // Root tree of `target`, so a clone can start fetching objects at once.
  bytes root_tree = 3;
}

// The changeset's blobs (and any trees) must already be in the object store.
// The repository is the changeset's own `repo` field. A repository's root
// changeset is InitRepo's, and refused here.
message CreateChangesetRequest {
  // Canonical encoding (`SCCS`).
  bytes changeset = 1;
}

message CreateChangesetResponse {
  bytes id = 1;
  bytes root_tree = 2;
}

// Fast-forward only. Without `expected_version` the ref is created and must
// not exist yet (ALREADY_EXISTS otherwise); with it, the move succeeds only if
// the ref is still at that version and `target` descends from its current
// target (FAILED_PRECONDITION otherwise).
message MoveRefRequest {
  string repo = 1;
  string name = 2;
  bytes target = 3;
  optional uint64 expected_version = 4;
}

message MoveRefResponse {
  // The new version.
  uint64 version = 1;
}

// File-level diff between two changesets; without `old`, against the empty tree.
message DiffRequest {
  string repo = 1;
  optional bytes old = 2;
  bytes new = 3;
}

message DiffResponse {
  // Sorted by path, byte order.
  repeated DiffEntry entries = 1;
}

message DiffEntry {
  string path = 1;
  // Absent for an added file.
  optional FileEntry old = 2;
  // Absent for a deleted file.
  optional FileEntry new = 3;
}

message FileEntry {
  bytes id = 1;
  FileType kind = 2;
  uint64 size = 3;
}

// Values match the canonical encoding's file-type byte.
enum FileType {
  FILE_TYPE_REGULAR = 0;
  FILE_TYPE_EXECUTABLE = 1;
  FILE_TYPE_SYMLINK = 2;
}

// First-parent history of `head`, newest first.
message LogRequest {
  string repo = 1;
  bytes head = 2;
  uint32 limit = 3;
}

// First-parent history of `head` restricted to changesets that touched
// `path` (a file, or anything beneath a directory), newest first.
message PathLogRequest {
  string repo = 1;
  bytes head = 2;
  string path = 3;
  uint32 limit = 4;
}

message LogResponse {
  // Canonical encodings (`SCCS`), newest first.
  repeated bytes changesets = 1;
}

message MergeBaseRequest {
  string repo = 1;
  bytes a = 2;
  bytes b = 3;
}

message MergeBaseResponse {
  // Absent if `a` and `b` share no ancestor.
  optional bytes base = 1;
}

// Replay `head`'s changesets that `onto` does not contain on top of `onto`,
// oldest first, and create each: same author, message and extra, first
// parent the previous one (a merge keeps its other parents), file changes
// merged three-way against it. A changeset whose changes `onto` already has
// is dropped. `head` must reach `onto`'s history through first parents
// (FAILED_PRECONDITION otherwise). Nothing is replayed if `head` already
// descends from `onto`; `head` is `onto` if `onto` descends from it.
message RebaseRequest {
  string repo = 1;
  bytes head = 2;
  bytes onto = 3;
}
message RebaseResponse {
  // The rebased head and its root tree; absent on a conflict.
  optional bytes head = 1;
  bytes root_tree = 2;
  // Changesets created by this call.
  uint32 created = 3;
  // On a conflict: the changeset that could not be replayed and the paths it
  // conflicts on, sorted. Nothing after it is replayed.
  bytes conflicted = 4;
  repeated string conflicts = 5;
}

// Merge `theirs` into `ours`: create a changeset with parents `[ours,
// theirs]` whose file changes, against `ours` only, bring in what `theirs`
// changed since their merge base. A file taken from `theirs` unchanged
// carries `copy_from` (its path, `theirs`), so blame follows `theirs`'
// history. Nothing is created if `ours` already contains `theirs` or the
// merge conflicts. An unknown `ours` or `theirs` is NOT_FOUND.
message MergeRequest {
  string repo = 1;
  bytes ours = 2;
  bytes theirs = 3;
  // The merge changeset's author, date and message.
  string author_name = 4;
  string author_email = 5;
  int64 author_unix_secs = 6;
  int32 author_tz_offset_minutes = 7;
  string message = 8;
}

message MergeResponse {
  // The merge changeset (`ours` if it already contains `theirs`) and its
  // root tree; absent on a conflict.
  optional bytes merged = 1;
  bytes root_tree = 2;
  // Whether this call created `merged`.
  bool created = 3;
  // On a conflict: the conflicting paths, sorted.
  repeated string conflicts = 4;
}

// Undo `changeset` on `head`: create a changeset with parent `head` that
// sets every path `changeset` changed back to its state at `changeset`'s
// first parent (the empty tree for a root). A restored file carries
// `copy_from` (its path, that parent), so blame keeps crediting its lines
// to the changesets that wrote them. Refused, creating nothing, when a path
// was changed again between `changeset` and `head`. `changeset` must be an
// ancestor of `head` and change at least one file (FAILED_PRECONDITION
// otherwise); an unknown `head` or `changeset` is NOT_FOUND.
message RevertRequest {
  string repo = 1;
  bytes head = 2;
  bytes changeset = 3;
  // The revert changeset's author, date and message.
  string author_name = 4;
  string author_email = 5;
  int64 author_unix_secs = 6;
  int32 author_tz_offset_minutes = 7;
  string message = 8;
}

message RevertResponse {
  // The revert changeset and its root tree; absent when refused.
  optional bytes reverted = 1;
  bytes root_tree = 2;
  // When refused: the paths changed since `changeset`, sorted.
  repeated string changed_since = 3;
}

// Line attribution of the file at `path` in `changeset`. A path that is not a
// file there is NOT_FOUND.
message BlameRequest {
  string repo = 1;
  bytes changeset = 2;
  string path = 3;
}

message BlameResponse {
  // Consecutive runs of lines, in file order.
  repeated BlameRun runs = 1;
}

message BlameRun {
  bytes changeset = 1;
  uint64 lines = 2;
}

// Ask the server to land `head` on `main`. The request records `main`'s
// current changeset as its base. An unknown repository or `head` is NOT_FOUND.
message SubmitChangeRequestRequest {
  string repo = 1;
  bytes head = 2;
  // Reply once the request is finished (LANDED, NEEDS_REBASE or REJECTED),
  // or with its current status after at most 20 seconds; otherwise reply at
  // once with it PENDING.
  bool wait = 3;
}

// An unknown repository or request is NOT_FOUND.
message GetChangeRequestRequest {
  string repo = 1;
  uint64 id = 2;
  // As in SubmitChangeRequestRequest.
  bool wait = 3;
}

// The newest requests of a repository, newest first. An unknown repository
// is NOT_FOUND.
message ListChangeRequestsRequest {
  string repo = 1;
  // Only requests in this status; UNSPECIFIED lists every status.
  ChangeRequestStatus status = 2;
  // Most requests to return; clamped to the server's maximum (1000).
  uint32 limit = 3;
}

message ListChangeRequestsResponse {
  repeated ChangeRequest requests = 1;
}

// Which request put each changeset on `main`, as its head (a fast-forward)
// or as the rebased changeset it landed as. An unknown repository is
// NOT_FOUND; more than 1000 changesets is INVALID_ARGUMENT.
message FindLandingRequest {
  string repo = 1;
  repeated bytes changesets = 2;
}

message FindLandingResponse {
  // In the order asked; a changeset no request landed is left out.
  repeated Landing landings = 1;
}

message Landing {
  bytes changeset = 1;
  // LANDED, with `landed_unix_micros`; the oldest if several landed it.
  ChangeRequest request = 2;
}

enum ChangeRequestStatus {
  CHANGE_REQUEST_STATUS_UNSPECIFIED = 0;
  // Waiting for the land worker.
  CHANGE_REQUEST_STATUS_PENDING = 1;
  // Being rebased onto `main` and landed.
  CHANGE_REQUEST_STATUS_LANDING = 2;
  // On `main` as `landed`.
  CHANGE_REQUEST_STATUS_LANDED = 3;
  // Conflicts with `main` at `conflicts`; `scn update` and land again.
  CHANGE_REQUEST_STATUS_NEEDS_REBASE = 4;
  // Rebased onto `main`, it would land nothing.
  CHANGE_REQUEST_STATUS_REJECTED = 5;
}

message ChangeRequest {
  uint64 id = 1;
  bytes head = 2;
  // `main`'s changeset when the request was submitted.
  bytes base = 3;
  ChangeRequestStatus status = 4;
  // The changeset `main` moved to; present once LANDED.
  optional bytes landed = 5;
  // Conflicting paths, sorted; non-empty only when NEEDS_REBASE.
  repeated string conflicts = 6;
  // When the request was submitted, in microseconds since the Unix epoch.
  uint64 submitted_unix_micros = 7;
  // When `main` moved to `landed`; present once LANDED.
  optional uint64 landed_unix_micros = 8;
}

// One principal's role on the paths of a repository under `path_prefix`.
message AccessGrant {
  // `github:<login>` or `sp:<name>`.
  string principal = 1;
  // A directory of the repository without a trailing `/`; empty for the
  // whole repository.
  string path_prefix = 2;
  // `reader`, `writer` or `admin`; each includes the ones before it.
  string role = 3;
}

// Give a principal a role, replacing its role on the same prefix. A bad
// principal, role or prefix is INVALID_ARGUMENT.
message GrantRequest {
  string repo = 1;
  AccessGrant grant = 2;
}

message GrantResponse {}

// Remove a principal's grant on a prefix; NOT_FOUND if it has none there.
message RevokeRequest {
  string repo = 1;
  string principal = 2;
  string path_prefix = 3;
}

message RevokeResponse {}

message ListGrantsRequest {
  string repo = 1;
}

message ListGrantsResponse {
  // By principal, then path prefix.
  repeated AccessGrant grants = 1;
}

// Who the caller's token names. With `repo`, also the caller's grants there.
message WhoAmIRequest {
  string repo = 1;
}

message WhoAmIResponse {
  string principal = 1;
  // When the token expires, in Unix seconds.
  int64 expires_unix_seconds = 2;
  // The caller's grants in `repo`, by path prefix.
  repeated AccessGrant grants = 3;
}

// ---------------------------------------------------------------------------
// Login: served only by scion-server, and the one service that needs no
// token. It runs GitHub's device flow for `scn login`: StartLogin asks GitHub
// for a device code, and the client calls FinishLogin with it every
// `interval_seconds` until the user has authorized it on GitHub. The server
// keeps no state between the two. A server without GitHub login answers
// FAILED_PRECONDITION; a denied code PERMISSION_DENIED; an expired one
// DEADLINE_EXCEEDED.
// ---------------------------------------------------------------------------

service LoginService {
  rpc StartLogin(StartLoginRequest) returns (StartLoginResponse);
  rpc FinishLogin(FinishLoginRequest) returns (FinishLoginResponse);
}

message StartLoginRequest {}

message StartLoginResponse {
  // Passed back to FinishLogin; never shown to the user.
  string device_code = 1;
  // What the user enters at `verification_uri`.
  string user_code = 2;
  string verification_uri = 3;
  uint32 expires_in_seconds = 4;
  uint32 interval_seconds = 5;
}

message FinishLoginRequest {
  string device_code = 1;
}

message FinishLoginResponse {
  // Empty while the user has not authorized the code yet.
  string token = 1;
  // `github:<login>`, with the token.
  string principal = 2;
  // Unix seconds, with the token.
  int64 expires_unix_seconds = 3;
  // While pending: how long to wait before the next FinishLogin.
  uint32 interval_seconds = 4;
}
