[package]
name = "scion-ingest"
description = "git → Scion importer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Pure Rust, no network features; only this crate builds it (docs/ARCHITECTURE.md).
gix = { version = "0.89", default-features = false, features = ["sha1", "revision"] }
async-trait.workspace = true
bytes.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
object_store = { version = "0.14.2", features = ["aws"] }
scion-derived.workspace = true
scion-server.workspace = true
scion-store.workspace = true
scion-types.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
scion-client.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
