[package]
name = "scion-store"
description = "Storage traits for Scion (metadata + object store) and the in-memory implementation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
scion-types.workspace = true
async-trait.workspace = true
bytes.workspace = true
thiserror.workspace = true
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }
object_store = { version = "0.14.2", features = ["aws"] }
zstd = "0.14.2"
futures = "0.3.34"
moka = { version = "0.12.16", default-features = false, features = ["sync"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = []
# Enables tests that need a live Postgres and S3-compatible server
# (see deploy/docker-compose.yml).
integration = []

[lints]
workspace = true
