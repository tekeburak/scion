# Every pull request to main passes these before it merges. Branch protection
# requires the branch to be up to date, so the squash commit is the head that
# was just checked; main itself is checked once a night, which catches two
# pull requests that pass alone and break together, and can be run by hand.
#
# The jobs run on our own Linux machines in Google Cloud (self-hosted runners
# labelled `konuq-ci`), not on GitHub's. A machine stops itself when idle and a
# webhook starts one when a job is queued, so a job waits a minute or two before
# it starts; when every machine is busy the job waits for the first free one.
# The machines are Spot instances: a job that failed with "lost communication
# with the server" or "received a shutdown signal" was stopped with its machine,
# not by the code; rerun it (`gh run rerun <run-id> --failed`). Nothing here may
# claim a fixed port: every service is mapped to a free port that the tests read
# from the environment (`SCION_TEST_*`). The runner has Docker and no `aws` CLI.
# The workspace persists between jobs and the disk is shared with another
# runner, so every job first checks free space and drops `target/` when it is
# low: a full disk fails a build with "No space left on device".
name: CI

on:
  pull_request:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test
    runs-on: [self-hosted, linux, konuq-ci]
    timeout-minutes: 45
    steps:
      - name: free disk
        run: |
          df -h / | tail -1
          if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 8 ]; then
            echo "under 8 GB free: dropping target/ and unused Docker data"
            rm -rf "$GITHUB_WORKSPACE/target"
            docker system prune -af >/dev/null 2>&1 || true
            df -h / | tail -1
          fi
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: arduino/setup-protoc@v3  # scion-proto's build script runs protoc
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        # `integration` needs live services; the integration job below runs it.
        run: cargo test --workspace
      - name: doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  integration:
    name: store integration (postgres + s3)
    runs-on: [self-hosted, linux, konuq-ci]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scion
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U scion -d scion"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: scion
          RUSTFS_SECRET_KEY: scionscion
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: ":9000"
        ports: ["9000"]
    steps:
      - name: free disk
        run: |
          df -h / | tail -1
          if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 8 ]; then
            echo "under 8 GB free: dropping target/ and unused Docker data"
            rm -rf "$GITHUB_WORKSPACE/target"
            docker system prune -af >/dev/null 2>&1 || true
            df -h / | tail -1
          fi
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: create bucket
        env:
          SCION_TEST_S3_ENDPOINT: http://localhost:${{ job.services.rustfs.ports['9000'] }}
        run: |
          s3() { docker run --rm --network host -e AWS_ACCESS_KEY_ID=scion -e AWS_SECRET_ACCESS_KEY=scionscion -e AWS_DEFAULT_REGION=us-east-1 amazon/aws-cli --endpoint-url "$SCION_TEST_S3_ENDPOINT" s3 "$@"; }
          for i in $(seq 1 30); do s3 ls >/dev/null 2>&1 && break; sleep 1; done
          s3 mb s3://scion-objects
      - name: test
        env:
          SCION_TEST_DATABASE_URL: postgres://scion:scion@localhost:${{ job.services.postgres.ports['5432'] }}/scion
          SCION_TEST_S3_ENDPOINT: http://localhost:${{ job.services.rustfs.ports['9000'] }}
        run: cargo test -p scion-store --features integration

  server:
    name: server end-to-end (scn + scion-server on postgres + s3)
    runs-on: [self-hosted, linux, konuq-ci]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scion
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U scion -d scion"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: scion
          RUSTFS_SECRET_KEY: scionscion
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: ":9000"
        ports: ["9000"]
    steps:
      - name: free disk
        run: |
          df -h / | tail -1
          if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 8 ]; then
            echo "under 8 GB free: dropping target/ and unused Docker data"
            rm -rf "$GITHUB_WORKSPACE/target"
            docker system prune -af >/dev/null 2>&1 || true
            df -h / | tail -1
          fi
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3  # scion-proto's build script runs protoc
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: create bucket
        env:
          SCION_TEST_S3_ENDPOINT: http://localhost:${{ job.services.rustfs.ports['9000'] }}
        run: |
          s3() { docker run --rm --network host -e AWS_ACCESS_KEY_ID=scion -e AWS_SECRET_ACCESS_KEY=scionscion -e AWS_DEFAULT_REGION=us-east-1 amazon/aws-cli --endpoint-url "$SCION_TEST_S3_ENDPOINT" s3 "$@"; }
          for i in $(seq 1 30); do s3 ls >/dev/null 2>&1 && break; sleep 1; done
          s3 mb s3://scion-objects
      - name: test
        env:
          SCION_TEST_DATABASE_URL: postgres://scion:scion@localhost:${{ job.services.postgres.ports['5432'] }}/scion
          SCION_TEST_S3_ENDPOINT: http://localhost:${{ job.services.rustfs.ports['9000'] }}
        run: cargo test -p scn --features integration --test e2e_stack

  deny:
    name: cargo-deny
    runs-on: [self-hosted, linux, konuq-ci]
    timeout-minutes: 15
    steps:
      - name: free disk
        run: |
          df -h / | tail -1
          if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 8 ]; then
            echo "under 8 GB free: dropping target/ and unused Docker data"
            rm -rf "$GITHUB_WORKSPACE/target"
            docker system prune -af >/dev/null 2>&1 || true
            df -h / | tail -1
          fi
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories
