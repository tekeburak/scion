name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: arduino/setup-protoc@v3  # scion-proto's build script runs protoc
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        # `integration` needs live services; the integration job below runs it.
        run: cargo test --workspace
      - name: doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  integration:
    name: store integration (postgres + s3)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scion
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scion -d scion"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: scion
          RUSTFS_SECRET_KEY: scionscion
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: ":9000"
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: create bucket
        env:
          AWS_ACCESS_KEY_ID: scion
          AWS_SECRET_ACCESS_KEY: scionscion
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for i in $(seq 1 30); do
            aws --endpoint-url http://localhost:9000 s3 ls >/dev/null 2>&1 && break; sleep 1
          done
          aws --endpoint-url http://localhost:9000 s3 mb s3://scion-objects
      - name: test
        run: cargo test -p scion-store --features integration

  server:
    name: server end-to-end (scn + scion-server on postgres + s3)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scion
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scion -d scion"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: scion
          RUSTFS_SECRET_KEY: scionscion
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: ":9000"
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3  # scion-proto's build script runs protoc
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: create bucket
        env:
          AWS_ACCESS_KEY_ID: scion
          AWS_SECRET_ACCESS_KEY: scionscion
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for i in $(seq 1 30); do
            aws --endpoint-url http://localhost:9000 s3 ls >/dev/null 2>&1 && break; sleep 1
          done
          aws --endpoint-url http://localhost:9000 s3 mb s3://scion-objects
      - name: test
        run: cargo test -p scn --features integration --test e2e_stack

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories
