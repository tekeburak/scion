# Local development stack: metadata DB (Postgres) + object store (RustFS, S3-compatible).
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d
#   cargo test -p scion-store --features integration
#   cargo test -p scn --features integration --test e2e_stack
#
# The end-to-end test runs scion-server in-process against these backends and drives
# the real `scn` binary. scion-cache / scion-daemon services arrive in Phase 4.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scion
      POSTGRES_PASSWORD: scion
      POSTGRES_DB: scion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scion -d scion"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Any S3-compatible server works; RustFS is small and on Docker Hub.
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: scion
      RUSTFS_SECRET_KEY: scionscion
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
    ports:
      - "9000:9000"
    volumes:
      - objectdata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create the object bucket.
  bucket-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: scion
      AWS_SECRET_ACCESS_KEY: scionscion
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
        for i in $(seq 1 30); do
          aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1 && break; sleep 1;
        done;
        aws --endpoint-url http://rustfs:9000 s3 mb s3://scion-objects 2>/dev/null || true;
        aws --endpoint-url http://rustfs:9000 s3 ls
      "

volumes:
  pgdata:
  objectdata:
