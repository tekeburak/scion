# Local development stack: metadata DB (Postgres) + object store (RustFS, S3-compatible)
# + scion-server built from this checkout, listening on loopback only.
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d --wait   # scn init http://127.0.0.1:7420 <repo>
#   export SCN_TOKEN=$(docker compose -f deploy/docker-compose.yml exec -T scion-server \
#       scion-server token sp:dev --ttl 30d)
#   docker compose -f deploy/docker-compose.yml exec -T scion-server \
#       scion-server grant '*' sp:dev admin                   # may create repositories
#   cargo test -p scion-store --features integration
#   cargo test -p scn --features integration --test e2e_stack
#
# The tests and scripts/bench-real run their own scion-server against the backends and
# need only `postgres rustfs bucket-init`. scion-cache / scion-daemon services arrive in
# Phase 4.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scion
      POSTGRES_PASSWORD: scion
      POSTGRES_DB: scion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scion -d scion"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Any S3-compatible server works; RustFS is small and on Docker Hub.
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: scion
      RUSTFS_SECRET_KEY: scionscion
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
    ports:
      - "9000:9000"
    volumes:
      - objectdata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create the object bucket.
  bucket-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: scion
      AWS_SECRET_ACCESS_KEY: scionscion
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
        for i in $(seq 1 30); do
          aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1 && break; sleep 1;
        done;
        aws --endpoint-url http://rustfs:9000 s3 mb s3://scion-objects 2>/dev/null || true;
        aws --endpoint-url http://rustfs:9000 s3 ls
      "

  # Rebuild after pulling changes: docker compose -f deploy/docker-compose.yml up -d --build
  scion-server:
    build:
      context: ..
      dockerfile: deploy/scion-server.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://scion:scion@postgres:5432/scion
      AWS_ENDPOINT: http://rustfs:9000
      AWS_ALLOW_HTTP: "true"
      AWS_BUCKET: scion-objects
      AWS_ACCESS_KEY_ID: scion
      AWS_SECRET_ACCESS_KEY: scionscion
      AWS_REGION: us-east-1
      SCION_LISTEN: 0.0.0.0:7420
      # Signs and checks tokens. This default is for the loopback-only local
      # stack; set SCION_TOKEN_KEY (`openssl rand -hex 32`) anywhere else.
      SCION_TOKEN_KEY: ${SCION_TOKEN_KEY:-6c6f63616c2d6f6e6c792d73636e2d6465762d6b65792d6e6f742d7365637265}
    ports:
      - "127.0.0.1:7420:7420"
    healthcheck:
      test: ["CMD", "bash", "-c", ": </dev/tcp/127.0.0.1/7420"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
  objectdata:
